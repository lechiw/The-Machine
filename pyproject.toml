[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-machine"
version = "0.1.0"
description = "本地监控告警系统 — 受《疑犯追踪》启发"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.20.0",
    "watchdog>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
